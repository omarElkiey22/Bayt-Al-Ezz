<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Bookshelf Base -->
  <rect x="12" y="76" width="76" height="8" rx="2.5" fill="#ECAE3C" stroke="#121838" stroke-width="3.5" />
  
  <!-- Book 1 (Left - Blue Hardcover) -->
  <rect x="18" y="24" width="13" height="52" rx="2" fill="#164E8C" stroke="#121838" stroke-width="3" />
  <line x1="18" y1="32" x2="31" y2="32" stroke="#ECAE3C" stroke-width="2.2" />
  <line x1="18" y1="66" x2="31" y2="66" stroke="#ECAE3C" stroke-width="2.2" />
  <rect x="20" y="42" width="9" height="14" rx="1" fill="#FFFFFF" />
  
  <!-- Book 2 (Gold Volume) -->
  <rect x="33" y="32" width="11" height="44" rx="2" fill="#EEB33B" stroke="#121838" stroke-width="3" />
  <line x1="33" y1="40" x2="44" y2="40" stroke="#164E8C" stroke-width="1.8" />
  <line x1="33" y1="68" x2="44" y2="68" stroke="#164E8C" stroke-width="1.8" />
  
  <!-- Book 3 (Royal Blue with Bookmark) -->
  <rect x="46" y="28" width="14" height="48" rx="2" fill="#2563EB" stroke="#121838" stroke-width="3" />
  <path d="M 51,76 L 51,86 L 53.5,83 L 56,86 L 56,76 Z" fill="#ECAE3C" stroke="#121838" stroke-width="1.5" />
  
  <!-- Book 4 (Leaning Right) -->
  <rect x="62" y="32" width="10" height="44" rx="2" transform="rotate(16 67 76)" fill="#164E8C" stroke="#121838" stroke-width="3" />
  
  <!-- Book 5 (End Leaning Book) -->
  <rect x="74" y="36" width="9" height="40" rx="2" transform="rotate(22 78 76)" fill="#F8FAFC" stroke="#121838" stroke-width="3" />
</svg>