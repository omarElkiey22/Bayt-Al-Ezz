  <circle cx="50" cy="34" r="15.5" fill="#E0E7FF" stroke="#121838" stroke-width="2.5" />
  <path d="M 42,24 A 12 12 0 0 1 58,24" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
  <rect x="48" y="53" width="4" height="7" fill="#ECAE3C" stroke="#121838" stroke-width="2" />
  
  <!-- Tabletop -->
  <rect x="18" y="60" width="64" height="6" rx="2" fill="#ECAE3C" stroke="#121838" stroke-width="3.5" />
  
  <!-- Drawer Unit -->
  <rect x="24" y="66" width="52" height="12" rx="2" fill="#F8FAFC" stroke="#121838" stroke-width="3" />
  <rect x="46" y="70" width="8" height="3" rx="1" fill="#ECAE3C" stroke="#121838" stroke-width="1.8" />
  
  <!-- Slender Vanity Table Legs -->
  <path d="M 22,66 L 20,88" stroke="#121838" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 78,66 L 80,88" stroke="#121838" stroke-width="3.2" stroke-linecap="round" />
  
  <!-- Perfume Bottle (Left) -->
  <rect x="26" y="48" width="10" height="12" rx="2" fill="#164E8C" stroke="#121838" stroke-width="2.2" />
  <circle cx="31" cy="44" r="2.8" fill="#ECAE3C" stroke="#121838" stroke-width="1.8" />
  
  <!-- Lipstick / Cosmetics (Right) -->
  <rect x="68" y="50" width="5" height="10" rx="1" fill="#121838" />
  <polygon points="68.5,50 72.5,50 72,44 68.5,47" fill="#ECAE3C" />
</svg>