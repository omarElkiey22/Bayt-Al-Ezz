<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Crossed Mechanic Tools on Top -->
  <!-- Wrench (Angled Left) -->
  <path d="M 28,15 C 24,19 28,24 32,24 L 46,34 L 50,30 L 36,20 C 36,16 31,12 28,15 Z" fill="#E2E8F0" stroke="#121838" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Screwdriver (Angled Right) -->
  <line x1="42" y1="32" x2="68" y2="16" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 40,33 L 48,28 L 44,22 L 36,27 Z" fill="#ECAE3C" stroke="#121838" stroke-width="2.2" stroke-linejoin="round" />
  
  <!-- Main Tool Chest Cabinet -->
  <rect x="24" y="38" width="52" height="46" rx="4" fill="#164E8C" stroke="#121838" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Top Work Surface / Lip -->
  <rect x="21" y="34" width="58" height="5.5" rx="2" fill="#ECAE3C" stroke="#121838" stroke-width="3" />
  
  <!-- Drawer 1 -->
  <rect x="28" y="43" width="44" height="9" rx="1.5" fill="#2563EB" stroke="#121838" stroke-width="2.2" />
  <line x1="45" y1="47.5" x2="55" y2="47.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Drawer 2 -->
  <rect x="28" y="55" width="44" height="9" rx="1.5" fill="#2563EB" stroke="#121838" stroke-width="2.2" />
  <line x1="45" y1="59.5" x2="55" y2="59.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Drawer 3 -->
  <rect x="28" y="67" width="44" height="12" rx="1.5" fill="#2563EB" stroke="#121838" stroke-width="2.2" />
  <line x1="45" y1="73" x2="55" y2="73" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Rolling Caster Wheels -->
  <circle cx="32" cy="88" r="4" fill="#121838" />
  <circle cx="68" cy="88" r="4" fill="#121838" />
</svg>