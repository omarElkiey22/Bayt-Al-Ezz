<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Machine Cabinet Body -->
  <rect x="20" y="14" width="60" height="74" rx="7" fill="#F8FAFC" stroke="#121838" stroke-width="4.5" stroke-linejoin="round" />
  
  <!-- Control Panel Separator -->
  <line x1="20" y1="31" x2="80" y2="31" stroke="#121838" stroke-width="3" />
  
  <!-- Detergent Drawer -->
  <rect x="25" y="19" width="18" height="8" rx="2" fill="#E2E8F0" stroke="#121838" stroke-width="2.5" />
  
  <!-- Program Rotary Dial -->
  <circle cx="56" cy="23" r="4.5" fill="#ECAE3C" stroke="#121838" stroke-width="2.5" />
  <line x1="56" y1="20.5" x2="56" y2="23" stroke="#121838" stroke-width="2" stroke-linecap="round" />
  
  <!-- Status Buttons / LEDs -->
  <circle cx="68" cy="23" r="2" fill="#164E8C" />
  <circle cx="74" cy="23" r="2" fill="#164E8C" />
  
  <!-- Large Door Outer Ring -->
  <circle cx="50" cy="58" r="22" fill="#E2E8F0" stroke="#121838" stroke-width="4.5" />
  
  <!-- Glass Window -->
  <circle cx="50" cy="58" r="15" fill="#164E8C" stroke="#121838" stroke-width="3.5" />
  
  <!-- Drum Water Wave -->
  <path d="M 37,64 C 41,60 45,67 50,63 C 55,59 59,65 63,61 L 63,70 C 59,72 41,72 37,70 Z" fill="#60A5FA" />
  
  <!-- Specular Glass Highlight Arc -->
  <path d="M 40,49 A 11 11 0 0 1 59,49" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  
  <!-- Door Handle Grip -->
  <path d="M 68,52 C 71,55 71,61 68,64" stroke="#121838" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Soap Bubbles Floating Above -->
  <circle cx="34" cy="10" r="3.5" fill="#FFFFFF" stroke="#121838" stroke-width="2" />
  <circle cx="44" cy="7" r="2.5" fill="#FFFFFF" stroke="#121838" stroke-width="1.8" />
  <circle cx="64" cy="9" r="3" fill="#FFFFFF" stroke="#121838" stroke-width="2" />
  
  <!-- Machine Feet -->
  <rect x="25" y="88" width="10" height="4" rx="1.5" fill="#121838" />
  <rect x="65" y="88" width="10" height="4" rx="1.5" fill="#121838" />
</svg>