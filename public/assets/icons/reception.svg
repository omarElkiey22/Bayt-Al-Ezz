<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Sofa Backrest -->
  <rect x="18" y="30" width="64" height="28" rx="6" fill="#164E8C" stroke="#121838" stroke-width="4" />
  <line x1="50" y1="30" x2="50" y2="58" stroke="#121838" stroke-width="3" />
  
  <!-- Left Armrest -->
  <rect x="12" y="44" width="12" height="26" rx="5" fill="#2563EB" stroke="#121838" stroke-width="3.5" />
  
  <!-- Right Armrest -->
  <rect x="76" y="44" width="12" height="26" rx="5" fill="#2563EB" stroke="#121838" stroke-width="3.5" />
  
  <!-- Seat Cushions -->
  <rect x="20" y="52" width="60" height="18" rx="4" fill="#3B82F6" stroke="#121838" stroke-width="3.5" />
  <line x1="50" y1="52" x2="50" y2="70" stroke="#121838" stroke-width="3" />
  
  <!-- Throw Pillows -->
  <rect x="24" y="46" width="13" height="13" rx="3" transform="rotate(-15 30 52)" fill="#ECAE3C" stroke="#121838" stroke-width="2.2" />
  <rect x="63" y="46" width="13" height="13" rx="3" transform="rotate(15 69 52)" fill="#ECAE3C" stroke="#121838" stroke-width="2.2" />
  
  <!-- Sofa Legs -->
  <path d="M 18,70 L 15,82" stroke="#121838" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 82,70 L 85,82" stroke="#121838" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="70" x2="50" y2="82" stroke="#121838" stroke-width="3" stroke-linecap="round" />
  
  <!-- Modern Reception Coffee Table (Front) -->
  <rect x="30" y="78" width="40" height="5" rx="2.5" fill="#ECAE3C" stroke="#121838" stroke-width="2.8" />
  <path d="M 36,83 L 34,91" stroke="#121838" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 64,83 L 66,91" stroke="#121838" stroke-width="2.5" stroke-linecap="round" />
  <rect x="47" y="72" width="6" height="6" rx="1.5" fill="#164E8C" stroke="#121838" stroke-width="1.8" />
</svg>