<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Paper Towel Roll Body -->
  <path d="M 20,25 L 20,74 A 12 4.5 0 0 0 44,74 L 44,25 Z" fill="#F8FAFC" stroke="#121838" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Paper Roll Top Face -->
  <ellipse cx="32" cy="25" rx="12" ry="4.5" fill="#E2E8F0" stroke="#121838" stroke-width="4" />
  <ellipse cx="32" cy="25" rx="3.5" ry="1.5" fill="#121838" />
  
  <!-- Hanging Unwound Paper Towel Sheet -->
  <path d="M 44,30 C 47,33 50,38 50,48 L 50,72 L 44,76 Z" fill="#F8FAFC" stroke="#121838" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Embossed Paper Dots -->
  <circle cx="27" cy="40" r="1.2" fill="#94A3B8" />
  <circle cx="37" cy="46" r="1.2" fill="#94A3B8" />
  <circle cx="27" cy="54" r="1.2" fill="#94A3B8" />
  <circle cx="37" cy="60" r="1.2" fill="#94A3B8" />
  
  <!-- Facial Tissue Box (Right / Front) -->
  <rect x="46" y="58" width="40" height="26" rx="4" fill="#164E8C" stroke="#121838" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Tissue Box Gold Decorative Band -->
  <rect x="46" y="68" width="40" height="5" fill="#ECAE3C" />
  
  <!-- Oval Box Dispenser Slot -->
  <ellipse cx="66" cy="58" rx="9" ry="2.8" fill="#0F172A" />
  
  <!-- Folded Tissue Pulling Out of Box -->
  <path d="M 60,58 C 57,44 67,40 67,46 C 67,38 75,42 72,58 Z" fill="#FFFFFF" stroke="#121838" stroke-width="3" stroke-linejoin="round" />
</svg>