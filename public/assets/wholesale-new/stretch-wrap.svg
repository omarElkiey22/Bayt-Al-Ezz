<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dimensional gradient for cylinder body -->
    <linearGradient id="wrapBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80CBC4" />
      <stop offset="25%" stop-color="#4DB6AC" />
      <stop offset="65%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#00695C" />
    </linearGradient>

    <!-- Top face gradient (overhead light reflection on plastic film layers) -->
    <linearGradient id="wrapTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B2DFDB" />
      <stop offset="100%" stop-color="#80CBC4" />
    </linearGradient>

    <!-- Hollow core inside gradient -->
    <linearGradient id="wrapCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00332C" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>

    <!-- Translucent loose plastic flap gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B2DFDB" />
      <stop offset="40%" stop-color="#4DB6AC" />
      <stop offset="85%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#00695C" />
    </linearGradient>

    <!-- Specular gloss sheen gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Circular badge background -->
  <circle cx="32" cy="32" r="28" fill="#E0F2F1" />

  <!-- Soft ground shadow under roll -->
  <ellipse cx="32" cy="48" rx="16" ry="3" fill="#B2DFDB" opacity="0.75" />

  <!-- Roll cylinder body -->
  <path d="M 19,19 L 19,43 A 8.5 3.2 0 0 0 36,43 L 36,19 Z" fill="url(#wrapBody)" />

  <!-- Broad soft plastic-sheen highlight streak -->
  <path d="M 21.5,20 L 21.5,42.2 Q 24,43 26.5,42.2 L 26.5,20 Q 24,19.2 21.5,20 Z" fill="url(#glossGrad)" />

  <!-- Sharp crisp specular highlight streak (glossy plastic reflection) -->
  <path d="M 23.2,21.5 L 23.2,41.2 Q 23.8,41.6 24.4,41.2 L 24.4,21.5 Q 23.8,21.1 23.2,21.5 Z" fill="#FFFFFF" opacity="0.75" />

  <!-- Subtle secondary vertical sheen near right curve -->
  <path d="M 33.5,21 L 33.5,41.8 Q 34,42.2 34.5,41.8 L 34.5,21 Q 34,20.6 33.5,21 Z" fill="#FFFFFF" opacity="0.2" />

  <!-- Shadow cast by loose flap onto cylinder body -->
  <path d="M 31,21 C 32.5,28 32.8,36 33.2,44.5 A 8.5 3.2 0 0 0 36,43 L 36,20.5 C 34.2,20.6 32.5,20.8 31,21 Z" fill="#004D40" opacity="0.25" />

  <!-- Roll top face ellipse -->
  <ellipse cx="27.5" cy="19" rx="8.5" ry="3.2" fill="url(#wrapTop)" />

  <!-- Wound plastic layer line on top face (pure filled shape) -->
  <path d="M 36,19.2 C 36,17.4 32.2,16.2 27.5,16.2 C 22.8,16.2 20.1,17.4 20.1,18.8 C 20.1,20.2 23.3,21.3 27.5,21.3 C 31.1,21.3 33.5,20.4 33.5,19.3 C 33.5,18.3 30.9,17.5 27.5,17.5 C 24.6,17.5 22.9,18.2 22.9,18.9 C 22.9,19.6 25,20.2 27.5,20.2 C 29.3,20.2 30.6,19.7 30.6,19.2 L 30,19.2 C 30,19.5 28.9,19.8 27.5,19.8 C 25.3,19.8 23.6,19.3 23.6,18.8 C 23.6,18.3 25,17.9 27.5,17.9 C 30.5,17.9 32.8,18.6 32.8,19.3 C 32.8,20.1 30.7,20.9 27.5,20.9 C 23.7,20.9 20.8,19.9 20.8,18.8 C 20.8,17.7 23.2,16.6 27.5,16.6 C 31.9,16.6 35.3,17.7 35.3,19.3 Z" fill="#00695C" opacity="0.6" />

  <!-- Core cardboard tube rim -->
  <ellipse cx="27.5" cy="19" rx="3.0" ry="1.2" fill="#80CBC4" />

  <!-- Inner core hollow opening -->
  <ellipse cx="27.5" cy="19" rx="2.2" ry="0.85" fill="url(#wrapCore)" />

  <!-- Loose plastic stretch wrap flap (semi-translucent film) -->
  <path d="M 34.5,20.5 C 38,21 42,22 46,23.5 C 46.8,29 45.4,35 46.2,42.5 C 43,43.5 38.5,44.2 34.2,45 C 33.8,36.5 33.8,28.5 34.5,20.5 Z" fill="url(#flapGrad)" opacity="0.85" />

  <!-- Top fold/curl highlight on the loose flap -->
  <path d="M 34.5,20.5 C 38,21 42,22 46,23.5 C 43.8,23.9 39,23 34.8,21.8 Z" fill="#FFFFFF" opacity="0.45" />

  <!-- Glossy light sheen ribbons on loose plastic flap -->
  <path d="M 36,26 Q 40.5,27 45.2,28.5 L 45.1,29.3 Q 40.5,27.8 36,26.8 Z" fill="#FFFFFF" opacity="0.45" />
  <path d="M 35.8,34 Q 40.3,34.8 45.4,36.2 L 45.3,37 Q 40.3,35.6 35.8,34.8 Z" fill="#FFFFFF" opacity="0.35" />

  <!-- Folded corner on loose plastic flap (distinct cling-wrap feature) -->
  <path d="M 42,43.8 L 46.2,39 L 46.2,42.5 Z" fill="#E0F2F1" opacity="0.9" />
  <!-- Crease line on folded corner -->
  <path d="M 42,43.8 L 46.2,39 L 45.8,39 L 41.7,43.8 Z" fill="#FFFFFF" opacity="0.7" />
</svg>
